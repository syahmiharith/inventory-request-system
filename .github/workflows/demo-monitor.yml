name: Demo health and cleanup monitor

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Exercise the failed-check signal without affecting production"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check production health and expired-data backlog
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            export DEMO_HEALTH_URL=http://127.0.0.1:1/api/health
          fi
          node scripts/demo-monitor.mjs
        env:
          DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          GH_MONITOR_TOKEN: ${{ github.token }}
